# Deploy automatico su Aruba via FTP a ogni push su main.
#   www.menudieta.it/app/  ← app (dist)          [secrets MENUDIETA_FTP_*]
#   www.menudieta.it/      ← sito pubblico (site/dist)
#   www.fitsy.it/app/      ← app con trasloco automatico verso menudieta  [secrets ARUBA_FTP_*, vecchio hosting]
#   www.fitsy.it/          ← solo .htaccess con redirect 301 pagina→pagina verso menudieta.it
name: Deploy su Aruba

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: aruba
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: cp deploy/htaccess-app dist/.htaccess
      - run: node site/build.mjs
      - uses: actions/upload-artifact@v4
        with: { name: app, path: dist/, include-hidden-files: true, retention-days: 1 }
      - uses: actions/upload-artifact@v4
        with: { name: site, path: site/dist/, include-hidden-files: true, retention-days: 1 }

  app-menudieta:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { name: app, path: dist/ }
      - name: Upload FTP → menudieta.it/app/
        id: ftp1
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.MENUDIETA_FTP_HOST }}
          username: ${{ secrets.MENUDIETA_FTP_USER }}
          password: ${{ secrets.MENUDIETA_FTP_PASSWORD }}
          protocol: ftp
          local-dir: dist/
          server-dir: www.menudieta.it/app/
          dangerous-clean-slate: false
      - name: Upload FTP → menudieta.it/app/ (2° tentativo, se il primo è fallito per FTP instabile)
        if: steps.ftp1.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.MENUDIETA_FTP_HOST }}
          username: ${{ secrets.MENUDIETA_FTP_USER }}
          password: ${{ secrets.MENUDIETA_FTP_PASSWORD }}
          protocol: ftp
          local-dir: dist/
          server-dir: www.menudieta.it/app/
          dangerous-clean-slate: false

  site-menudieta:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { name: site, path: site/dist/ }
      - name: Upload FTP → menudieta.it/ (non tocca /app/)
        id: ftp2
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.MENUDIETA_FTP_HOST }}
          username: ${{ secrets.MENUDIETA_FTP_USER }}
          password: ${{ secrets.MENUDIETA_FTP_PASSWORD }}
          protocol: ftp
          local-dir: site/dist/
          server-dir: www.menudieta.it/
          state-name: .ftp-deploy-sync-state-site.json
          dangerous-clean-slate: false
          exclude: |
            app/**
      - name: Upload FTP → menudieta.it/ (non tocca /app/) (2° tentativo, se il primo è fallito per FTP instabile)
        if: steps.ftp2.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.MENUDIETA_FTP_HOST }}
          username: ${{ secrets.MENUDIETA_FTP_USER }}
          password: ${{ secrets.MENUDIETA_FTP_PASSWORD }}
          protocol: ftp
          local-dir: site/dist/
          server-dir: www.menudieta.it/
          state-name: .ftp-deploy-sync-state-site.json
          dangerous-clean-slate: false
          exclude: |
            app/**

  # Vecchio dominio: l'app resta (con trasloco automatico), il sito diventa un redirect.
  fitsy-vecchio:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with: { name: app, path: dist/ }
      - name: Upload FTP → fitsy.it/app/
        id: ftp3
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.ARUBA_FTP_HOST }}
          username: ${{ secrets.ARUBA_FTP_USER }}
          password: ${{ secrets.ARUBA_FTP_PASSWORD }}
          protocol: ftp
          local-dir: dist/
          server-dir: www.fitsy.it/app/
          dangerous-clean-slate: false
      - name: Upload FTP → fitsy.it/app/ (2° tentativo, se il primo è fallito per FTP instabile)
        if: steps.ftp3.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.ARUBA_FTP_HOST }}
          username: ${{ secrets.ARUBA_FTP_USER }}
          password: ${{ secrets.ARUBA_FTP_PASSWORD }}
          protocol: ftp
          local-dir: dist/
          server-dir: www.fitsy.it/app/
          dangerous-clean-slate: false
      - name: Upload FTP → fitsy.it/ (.htaccess di redirect)
        id: ftp4
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.ARUBA_FTP_HOST }}
          username: ${{ secrets.ARUBA_FTP_USER }}
          password: ${{ secrets.ARUBA_FTP_PASSWORD }}
          protocol: ftp
          local-dir: deploy/fitsy-redirect/
          server-dir: www.fitsy.it/
          state-name: .ftp-deploy-sync-state-site.json
          dangerous-clean-slate: false
          exclude: |
            app/**
      - name: Upload FTP → fitsy.it/ (.htaccess di redirect) (2° tentativo, se il primo è fallito per FTP instabile)
        if: steps.ftp4.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.ARUBA_FTP_HOST }}
          username: ${{ secrets.ARUBA_FTP_USER }}
          password: ${{ secrets.ARUBA_FTP_PASSWORD }}
          protocol: ftp
          local-dir: deploy/fitsy-redirect/
          server-dir: www.fitsy.it/
          state-name: .ftp-deploy-sync-state-site.json
          dangerous-clean-slate: false
          exclude: |
            app/**
